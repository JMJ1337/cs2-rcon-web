# Portainer-Stack für den Spielservermanager (Repo: cs2-rcon-web)
# Portainer → Stacks → Add stack → "Web editor" (Inhalt einfügen) oder "Repository" (Compose path: portainer-stack.yml)
# Variablen unten unter "Environment variables" setzen (Vorlage: stack.env).
# Auto-Update: Repository-Stack mit "GitOps updates" (Polling, z. B. 5m) + "Re-pull image" aktivieren.

services:
  cs2-rcon:
    image: ${IMAGE:-ghcr.io/dein-github-name/cs2-rcon-web:latest}
    container_name: spielservermanager
    user: "0:0"                     # nötig für den Zugriff auf den Docker-Socket
    restart: unless-stopped
    pull_policy: always
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD muss gesetzt sein}
      SESSION_HOURS: ${SESSION_HOURS:-24}
      RCON_TIMEOUT: ${RCON_TIMEOUT:-4}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - rcon-data:/data
      # Container starten/stoppen, Logs, neue Spielserver anlegen, Docker-Scan.
      # Achtung: Zugriff auf den Docker-Socket = volle Kontrolle über den Docker-Host.
      # Wer das nicht möchte, diese Zeile entfernen – der Rest funktioniert weiter.
      - /var/run/docker.sock:/var/run/docker.sock
      # Nur lesend: echte Netzwerkkarten des Hosts für den Netzwerkdurchsatz (sonst Summe der Container)
      - /proc:/host/proc:ro
    labels:
      com.groh-pa.description: "Spielservermanager"
      com.groh-pa.build: "81f6120"   # wird nach jedem Image-Build automatisch aktualisiert (Auto-Update)

volumes:
  rcon-data:
    name: cs2-rcon-data
