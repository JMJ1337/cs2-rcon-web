name: Docker-Image bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", "tools/**", "Dockerfile", "requirements.txt", ".github/workflows/docker.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # für den Build-Stempel in portainer-stack.yml
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image-Name (kleingeschrieben)
        id: img
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build-Datum
        id: date
        run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Bauen & pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('1.{0}', github.run_number) }}
            APP_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.now }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Portainer-GitOps erkennt diese Änderung und deployt mit "Re-pull image" das neue Image
      - name: Build-Stempel in portainer-stack.yml setzen
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i -E "s/(org\.spielservermanager\.build: \").*(\")/\1${GITHUB_SHA::7}\2/" portainer-stack.yml
          if git diff --quiet; then echo "nichts zu tun"; exit 0; fi
          git commit -am "Portainer: neues Image ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:main
