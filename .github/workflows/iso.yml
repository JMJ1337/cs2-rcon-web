name: Debian-ISO bauen

# Bootfähiges Installations-ISO: Debian + automatische Einrichtung (Docker, Portainer, Spielservermanager, optional Lancache)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xorriso
      - name: ISO bauen
        run: |
          v=${GITHUB_REF_NAME#v}; [ "$GITHUB_REF_TYPE" = tag ] || v=dev
          bash iso/build-iso.sh "gsm-debian-${v}-amd64.iso"
          sha256sum gsm-debian-*.iso > gsm-debian-${v}-amd64.iso.sha256
      - name: Als Build-Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: gsm-debian-iso
          path: gsm-debian-*.iso*
          retention-days: 14
      - name: An das Release hängen
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gsm-debian-*.iso
            gsm-debian-*.iso.sha256
