# Debian-Installation für den GrohLAN Spielservermanager
# Fragt nur: Root-/Benutzer-Passwort, Festplatte (mit Bestätigung). Alles andere ist vorgegeben.
d-i debian-installer/locale string de_DE.UTF-8
d-i keyboard-configuration/xkb-keymap select de
d-i console-setup/ask_detect boolean false
d-i time/zone string Europe/Berlin
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# Netzwerk per DHCP
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string spielserver
d-i netcfg/get_domain string lan
d-i netcfg/hostname string spielserver

# Paketquelle
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/disable-cdrom-entries boolean true

# Konten: Root gesperrt, ein Admin-Benutzer mit sudo (Name + Passwort fragt der Installer)
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Spielserver Admin
d-i passwd/username string gsm

# Festplatte: geführt, ganze Platte, eine Partition – Auswahl der Platte und Bestätigung fragt der Installer
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman/choose_partition select finish

# Pakete
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string curl ca-certificates jq sudo iproute2
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Spielservermanager-Installer beim ersten Start auf tty1
d-i preseed/late_command string \
  mkdir -p /target/usr/local/share/gsm; \
  cp /cdrom/gsm/install.sh /target/usr/local/share/gsm/install.sh; \
  cp /cdrom/gsm/gsm-firstboot /target/usr/local/sbin/gsm-firstboot; \
  cp /cdrom/gsm/gsm-firstboot.service /target/etc/systemd/system/gsm-firstboot.service; \
  chmod 755 /target/usr/local/sbin/gsm-firstboot /target/usr/local/share/gsm/install.sh; \
  in-target systemctl enable gsm-firstboot.service

d-i finish-install/reboot_in_progress note
