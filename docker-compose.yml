services:
  cs2-rcon:
    build: .
    image: cs2-rcon-web:latest
    container_name: cs2-rcon-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD setzen, z. B. ADMIN_PASSWORD=geheim docker compose up -d}"   # Notzugang admin
      SESSION_HOURS: "24"               # wie lange ein Login gültig bleibt
      RCON_TIMEOUT: "4"                 # Sekunden
      TZ: Europe/Berlin
    volumes:
      - rcon-data:/data                 # Serverliste (servers.json) bleibt erhalten
    # Laufen die CS2-Server auf demselben Host (z. B. auch in Docker mit network_mode: host)?
    # Dann statt "ports" einfach:
    # network_mode: host

volumes:
  rcon-data:
